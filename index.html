<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Display + mono type: General Sans & Zodiak (Fontshare), JetBrains Mono (Google) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=zodiak@400i,500i,700i&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Gordon Li — Portfolio</title>
    <meta
      name="description"
      content="Gordon Li — founder & engineer based in San Francisco. Selected work: Tote, Shotcall, Koshi, Grapevine, Viridian, PartnerHire, Trace."
    />

    <!-- Open Graph / social preview. NOTE: replace the og:url + og:image origin
         with your production domain once live for the widest crawler support. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hey there, I'm Gordon" />
    <meta
      property="og:description"
      content="Founder & engineer based in San Francisco. A look at what I've been building."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hey there, I'm Gordon" />
    <meta
      name="twitter:description"
      content="Founder & engineer based in San Francisco."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
